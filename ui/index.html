<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF2Excel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#lg)"/>
            <rect x="12" y="14" width="24" height="20" rx="2.5" fill="#fff"/>
            <path d="M12 20.5h24" stroke="#4F46E5" stroke-width="2.2"/>
            <path d="M12 27h24M20.5 20.5V34M28 20.5V34" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
            <defs>
              <linearGradient id="lg" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6366F1"/><stop offset="1" stop-color="#4F46E5"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-text">
          <h1>PDF2Excel</h1>
          <p>PDF 表格，精准提取为 Excel</p>
        </div>
      </div>
      <div class="privacy-pill" title="文件仅在本地处理，不会上传">
        <span class="dot"></span>本地转换 · 无需联网
      </div>
    </header>

    <!-- 拖放区 -->
    <section id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="添加 PDF 文件">
      <svg class="dz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0 4 4m-4-4-4 4"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <div class="dz-main">拖拽 PDF 文件到此处</div>
      <div class="dz-sub">或 <button id="btnBrowse" class="link-btn">点击选择文件</button>，支持批量添加</div>
    </section>

    <!-- 设置行 -->
    <section class="settings">
      <div class="field">
        <label for="selMode">提取模式</label>
        <div class="select-wrap">
          <select id="selMode">
            <option value="auto">自动识别</option>
            <option value="lines">线框表格</option>
            <option value="text">无框表格</option>
          </select>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="field">
        <label for="selSheet">工作表</label>
        <div class="select-wrap">
          <select id="selSheet">
            <option value="merge">合并为一个</option>
            <option value="pages">每页一个</option>
          </select>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>
      <div class="field field-grow">
        <label for="inpPages">页码范围</label>
        <input id="inpPages" type="text" placeholder="全部页 · 示例 1-5,8,11-13" spellcheck="false">
      </div>
      <div class="field">
        <label>保存到</label>
        <button id="btnOutDir" class="dir-btn" title="">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          </svg>
          <span id="outDirText">…</span>
        </button>
      </div>
    </section>

    <!-- 文件列表 -->
    <section class="file-section">
      <div class="file-head">
        <span class="file-title">文件列表<span id="fileCount" class="count"></span></span>
        <button id="btnClear" class="link-btn danger hidden">清空列表</button>
      </div>
      <div id="fileList" class="file-list">
        <div id="emptyState" class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5z"/>
            <path d="M14 3v5h5M9 13h6M9 17h4"/>
          </svg>
          <p>尚无文件 — 将 PDF 拖到上方虚线框，或点击选择</p>
        </div>
      </div>
    </section>

    <!-- 底部操作栏 -->
    <footer class="actionbar">
      <div id="summary" class="summary">准备就绪</div>
      <button id="btnConvert" class="cta" disabled>
        <span id="ctaLabel">开始转换</span>
      </button>
    </footer>
  </div>

  <!-- 全窗口拖放遮罩 -->
  <div id="dropOverlay" class="drop-overlay hidden">
    <div class="drop-overlay-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <p>松开鼠标，添加 PDF 文件</p>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
